<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER RUNNER: OVERDRIVE</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #07070d;
      color: #e0e6ed;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      width: 900px;
      height: 600px;
      border: 2px solid #00f0ff;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.3), inset 0 0 15px rgba(255, 0, 85, 0.2);
      background: #0d0e15;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Interface Overlay */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(7, 7, 13, 0.88);
      backdrop-filter: blur(8px);
      z-index: 10;
      transition: opacity 0.3s ease;
    }

    .hidden {
      display: none !important;
    }

    h1 {
      font-size: 3rem;
      text-transform: uppercase;
      letter-spacing: 4px;
      color: #00f0ff;
      text-shadow: 0 0 15px #00f0ff, 0 0 30px #ff0055;
      margin-bottom: 10px;
    }

    p.subtitle {
      color: #ff0055;
      font-size: 1.1rem;
      margin-bottom: 25px;
      letter-spacing: 2px;
    }

    .btn {
      padding: 12px 32px;
      font-size: 1.1rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #07070d;
      background: #00f0ff;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 0 15px #00f0ff;
      transition: all 0.2s ease;
      margin: 8px;
    }

    .btn:hover {
      background: #ff0055;
      color: #fff;
      box-shadow: 0 0 20px #ff0055;
      transform: translateY(-2px);
    }

    /* HUD */
    #hud {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 5;
    }

    .stat-box {
      background: rgba(13, 14, 21, 0.7);
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid rgba(0, 240, 255, 0.4);
      font-weight: bold;
      letter-spacing: 1px;
    }

    .bar-container {
      width: 180px;
      height: 14px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 7px;
      overflow: hidden;
      margin-top: 4px;
      border: 1px solid #333;
    }

    .bar-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #ff0055, #00f0ff);
      transition: width 0.15s ease;
    }

    /* Controls instructions */
    .controls-info {
      margin-top: 20px;
      font-size: 0.9rem;
      color: #8a99ad;
      text-align: center;
      line-height: 1.6;
    }

    .key {
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid #555;
      color: #fff;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <!-- Game Canvas -->
    <canvas id="gameCanvas" width="900" height="600"></canvas>

    <!-- Heads Up Display (HUD) -->
    <div id="hud">
      <div>
        <div class="stat-box">
          SALUD
          <div class="bar-container">
            <div id="health-bar" class="bar-fill"></div>
          </div>
        </div>
      </div>
      <div class="stat-box" style="text-align: center;">
        OLEADA: <span id="wave-txt" style="color: #00f0ff;">1</span>
      </div>
      <div class="stat-box" style="text-align: right;">
        PUNTOS: <span id="score-txt" style="color: #ff0055;">0</span>
      </div>
    </div>

    <!-- Start / Game Over Screen -->
    <div id="menu-overlay" class="overlay">
      <h1 id="menu-title">CYBER RUNNER</h1>
      <p class="subtitle" id="menu-sub">SOBREVIVE A LA HORDA NEÓN</p>

      <button id="start-btn" class="btn">INICIAR JUEGO</button>

      <div class="controls-info">
        <p><span class="key">W</span> <span class="key">A</span> <span class="key">S</span> <span class="key">D</span> o <span class="key">Flechas</span> para Moverte</p>
        <p>Apunta y Dispara con el <span class="key">Mouse</span> (Clic Izquierdo)</p>
        <p><span class="key">ESPACIO</span> para Dash / Impulso rápido</p>
      </div>
    </div>
  </div>

  <script>
    // --- AUDIO SYNTHESIZER (Web Audio API) ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
    }

    function playSound(type) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;

      if (type === 'shoot') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.1);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
      } else if (type === 'hit') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.linearRampToValueAtTime(30, now + 0.15);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
      } else if (type === 'dash') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.15);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
      }
    }

    // --- GAME ENGINE SETUP ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const healthBar = document.getElementById('health-bar');
    const scoreTxt = document.getElementById('score-txt');
    const waveTxt = document.getElementById('wave-txt');
    const menuOverlay = document.getElementById('menu-overlay');
    const menuTitle = document.getElementById('menu-title');
    const menuSub = document.getElementById('menu-sub');
    const startBtn = document.getElementById('start-btn');

    let isPlaying = false;
    let score = 0;
    let wave = 1;
    let keys = {};
    let mouse = { x: canvas.width / 2, y: canvas.height / 2, down: false };

    // --- GAME OBJECTS ---
    let player;
    let bullets = [];
    let enemies = [];
    let particles = [];

    class Player {
      constructor() {
        this.x = canvas.width / 2;
        this.y = canvas.height / 2;
        this.radius = 16;
        this.speed = 4;
        this.maxHealth = 100;
        this.health = 100;
        this.color = '#00f0ff';
        this.dashCooldown = 0;
        this.shootTimer = 0;
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        // Muro de brillo / Glow
        ctx.shadowBlur = 15;
        ctx.shadowColor = this.color;

        // Cuerpo del Jugador
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#0d0e15';
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 3;
        ctx.fill();
        ctx.stroke();

        // Cañón apuntando al mouse
        const angle = Math.atan2(mouse.y - this.y, mouse.x - this.x);
        ctx.rotate(angle);
        ctx.fillStyle = this.color;
        ctx.fillRect(0, -3, this.radius + 8, 6);

        ctx.restore();
      }

      update() {
        // Movimiento
        let dx = 0, dy = 0;
        if (keys['w'] || keys['W'] || keys['ArrowUp']) dy -= 1;
        if (keys['s'] || keys['S'] || keys['ArrowDown']) dy += 1;
        if (keys['a'] || keys['A'] || keys['ArrowLeft']) dx -= 1;
        if (keys['d'] || keys['D'] || keys['ArrowRight']) dx += 1;

        // Normalizar velocidad diagonal
        if (dx !== 0 && dy !== 0) {
          dx *= 0.7071;
          dy *= 0.7071;
        }

        this.x += dx * this.speed;
        this.y += dy * this.speed;

        // Límites de pantalla
        this.x = Math.max(this.radius, Math.min(canvas.width - this.radius, this.x));
        this.y = Math.max(this.radius, Math.min(canvas.height - this.radius, this.y));

        // Dash (Espacio)
        if (keys[' '] && this.dashCooldown <= 0 && (dx !== 0 || dy !== 0)) {
          this.x += dx * 60;
          this.y += dy * 60;
          this.dashCooldown = 60; // Frames de cooldown
          playSound('dash');
          createBurst(this.x, this.y, '#00f0ff', 12);
        }

        if (this.dashCooldown > 0) this.dashCooldown--;

        // Disparo continuo
        if (mouse.down && this.shootTimer <= 0) {
          this.shoot();
          this.shootTimer = 10; // Cadencia de disparo
        }
        if (this.shootTimer > 0) this.shootTimer--;
      }

      shoot() {
        const angle = Math.atan2(mouse.y - this.y, mouse.x - this.x);
        bullets.push(new Bullet(this.x, this.y, angle));
        playSound('shoot');
      }
    }

    class Bullet {
      constructor(x, y, angle) {
        this.x = x;
        this.y = y;
        this.speed = 10;
        this.vx = Math.cos(angle) * this.speed;
        this.vy = Math.sin(angle) * this.speed;
        this.radius = 4;
        this.color = '#00f0ff';
        this.markedForDeletion = false;
      }

      draw() {
        ctx.save();
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.restore();
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;

        if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
          this.markedForDeletion = true;
        }
      }
    }

    class Enemy {
      constructor(x, y, type) {
        this.x = x;
        this.y = y;
        this.type = type; // 'chaser' o 'fast'
        this.radius = type === 'fast' ? 12 : 18;
        this.speed = type === 'fast' ? 2.8 : 1.8;
        this.health = type === 'fast' ? 20 : 40;
        this.maxHealth = this.health;
        this.color = type === 'fast' ? '#ffcc00' : '#ff0055';
        this.markedForDeletion = false;
      }

      draw() {
        ctx.save();
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#0d0e15';
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 3;
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }

      update() {
        const angle = Math.atan2(player.y - this.y, player.x - this.x);
        this.x += Math.cos(angle) * this.speed;
        this.y += Math.sin(angle) * this.speed;
      }
    }

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.radius = Math.random() * 3 + 1;
        this.vx = (Math.random() - 0.5) * 6;
        this.vy = (Math.random() - 0.5) * 6;
        this.alpha = 1;
        this.decay = Math.random() * 0.03 + 0.01;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.restore();
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= this.decay;
      }
    }

    function createBurst(x, y, color, count = 10) {
      for (let i = 0; i < count; i++) {
        particles.push(new Particle(x, y, color));
      }
    }

    // --- GAME LOGIC & WAVES ---
    function spawnWave() {
      const enemyCount = 4 + wave * 3;
      for (let i = 0; i < enemyCount; i++) {
        let x, y;
        // Aparecer fuera de los bordes
        if (Math.random() < 0.5) {
          x = Math.random() < 0.5 ? -20 : canvas.width + 20;
          y = Math.random() * canvas.height;
        } else {
          x = Math.random() * canvas.width;
          y = Math.random() < 0.5 ? -20 : canvas.height + 20;
        }
        const type = Math.random() > 0.6 ? 'fast' : 'chaser';
        enemies.push(new Enemy(x, y, type));
      }
    }

    function startNewGame() {
      initAudio();
      player = new Player();
      bullets = [];
      enemies = [];
      particles = [];
      score = 0;
      wave = 1;
      isPlaying = true;

      scoreTxt.textContent = score;
      waveTxt.textContent = wave;
      healthBar.style.width = '100%';

      menuOverlay.classList.add('hidden');
      spawnWave();
      requestAnimationFrame(gameLoop);
    }

    function gameOver() {
      isPlaying = false;
      menuTitle.textContent = 'GAME OVER';
      menuSub.textContent = `Puntuación final: ${score} | Oleadas: ${wave}`;
      startBtn.textContent = 'REINTENTAR';
      menuOverlay.classList.remove('hidden');
    }

    // --- MAIN GAME LOOP ---
    function gameLoop() {
      if (!isPlaying) return;

      // Limpiar pantalla con efecto de rastro (motion blur)
      ctx.fillStyle = 'rgba(13, 14, 21, 0.3)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Actualizar y dibujar Jugador
      player.update();
      player.draw();

      // Proyectiles
      bullets.forEach((b, index) => {
        b.update();
        b.draw();
        if (b.markedForDeletion) bullets.splice(index, 1);
      });

      // Partículas
      particles.forEach((p, index) => {
        p.update();
        p.draw();
        if (p.alpha <= 0) particles.splice(index, 1);
      });

      // Enemigos y Colisiones
      enemies.forEach((enemy, eIndex) => {
        enemy.update();
        enemy.draw();

        // Colisión Enemigo vs Jugador
        const distToPlayer = Math.hypot(player.x - enemy.x, player.y - enemy.y);
        if (distToPlayer < player.radius + enemy.radius) {
          player.health -= 15;
          healthBar.style.width = Math.max(0, (player.health / player.maxHealth) * 100) + '%';
          createBurst(enemy.x, enemy.y, '#ff0055', 8);
          playSound('hit');
          enemies.splice(eIndex, 1);

          if (player.health <= 0) gameOver();
        }

        // Colisión Balas vs Enemigo
        bullets.forEach((bullet, bIndex) => {
          const distToBullet = Math.hypot(bullet.x - enemy.x, bullet.y - enemy.y);
          if (distToBullet < bullet.radius + enemy.radius) {
            enemy.health -= 20;
            bullets.splice(bIndex, 1);
            createBurst(bullet.x, bullet.y, '#00f0ff', 4);

            if (enemy.health <= 0) {
              score += enemy.type === 'fast' ? 150 : 100;
              scoreTxt.textContent = score;
              createBurst(enemy.x, enemy.y, enemy.color, 12);
              playSound('hit');
              enemies.splice(eIndex, 1);
            }
          }
        });
      });

      // Siguiente Oleada
      if (enemies.length === 0) {
        wave++;
        waveTxt.textContent = wave;
        // Curar un poco al jugador entre oleadas
        player.health = Math.min(player.maxHealth, player.health + 20);
        healthBar.style.width = (player.health / player.maxHealth) * 100 + '%';
        spawnWave();
      }

      requestAnimationFrame(gameLoop);
    }

    // --- EVENT LISTENERS ---
    window.addEventListener('keydown', e => keys[e.key] = true);
    window.addEventListener('keyup', e => keys[e.key] = false);

    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      mouse.x = e.clientX - rect.left;
      mouse.y = e.clientY - rect.top;
    });

    canvas.addEventListener('mousedown', () => mouse.down = true);
    window.addEventListener('mouseup', () => mouse.down = false);

    startBtn.addEventListener('click', startNewGame);
  </script>
</body>
</html>
